# Calibrating the grounded judge (design §8, S13; lite-eval design §9, §18.24): the judge is the
# target, each case an answer with a label fixed by construction (eval/make_judge_grounded.py).
#   uv run lite-eval run eval/judge-grounded/suites/calibrate.yaml --config qwen3-8b-nothink
# Needs Ollama on 127.0.0.1:11434 with qwen3:8b. Runs are written to eval/judge-grounded/runs/.
schema_version: 1
name: grounded-judge-calibration
pack: judging
dataset: ../datasets/grounded-golden
targets:
  - python: lite_eval.judges.target:judge_target
    configs:
      - name: qwen3-8b-nothink
        rubric: grounded
        provider: ollama
        model: qwen3:8b
        base_url: http://127.0.0.1:11434
        think: false
        billing: free
      - name: qwen3-8b-think
        rubric: grounded
        provider: ollama
        model: qwen3:8b
        base_url: http://127.0.0.1:11434
        think: true
        billing: free
repeats: 2  # a model, even at temperature 0 (methodology §4)
concurrency: 1  # one local model: parallel calls only queue
timeout_s: 300
kb:
  eval: 2026-11-18-lite-rag-grounded-judge
  project: lite-rag
  timezone: Pacific/Auckland  # the owner's day, not UTC's
  task: judging
  dataset: "223 answers to 31 golden questions (en and zh): 193 constructed (the evidence sentence citing its paragraph; one mechanical corruption each, one hand-written contradiction of the source and one plausible elaboration; or the citation dropped) and 30 real `literag ask` answers labelled by reading"
  grader: constructed
  metrics:
    label_agreement: accuracy
  notes: "qwen3:8b on local Ollama as the grounded judge of lite-rag answers; calibration before use on real `literag ask` answers"
