# S14 (lite-model §15): the control, qwen3:8b straight from Ollama (the default llm), next to the
# same model through the proxy (llm-proxy-workhorse.yaml). The rest is chunk-markdown.yaml.
chunking: {strategy: markdown, unit: tokens, size: 120, overlap: 20, min_size: 20}
retrieval: {mode: hybrid}
llm: {backend: ollama, model: qwen3:8b}
