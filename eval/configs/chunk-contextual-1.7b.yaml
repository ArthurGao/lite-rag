chunking:
  strategy: markdown
  unit: tokens
  size: 120
  overlap: 20
  min_size: 20
  contextual: {enabled: true}
retrieval: {mode: hybrid}
# the contextual role on the small model (2026-11-19: is a fixed small model enough for contexts?)
llm: {roles: {contextual: {model: "qwen3:1.7b", reasoning_effort: none}}}
