# S21: the router through llm-gateway's claude-sub-haiku (subscription; owner-approved runs only)
chunking: {strategy: markdown, unit: tokens, size: 120, overlap: 20, min_size: 20}
graph: {enabled: true}
retrieval:
  mode: route
  hybrid_paths: [vector, bm25, graph]
  router: {modes: [vector, hybrid]}
llm:
  # No output cap: the gateway's claude-agent-sdk backend cannot cap output and says so
  # (X-LLMGW-Ignored-Params), which lite-model refuses (IgnoredParameter). The top-level null
  # stays at the top level; the route role unsets its own 256 and inherits it.
  max_output_tokens: null
  roles:
    route: {backend: gateway, model: claude-sub-haiku, reasoning_effort: null, max_output_tokens: null}
