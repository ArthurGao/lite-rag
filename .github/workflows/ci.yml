name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lite_rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LITERAG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lite_rag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra anthropic  # the anthropic client is tested with a fake SDK client
      - run: uv run ruff check && uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
