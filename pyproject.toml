[project]
name = "lite-rag"
version = "0.1.0"
description = "A small, fully local RAG engine for learning: own chunking, BM25 + vector hybrid, rerank, switchable LLM"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings[yaml]>=2.6",
    "typer>=0.15",
    "httpx2>=2.16",
    "jinja2>=3.1",
    "jieba>=0.42.1",
    # The default store (design §4). Pinned exactly: an upgrade re-runs `-m ollama` and the eval.
    "psycopg[binary,pool]==3.3.8",
    "tokenizers>=0.21",
    # Every LLM call (design §6, S15), from a release wheel in [tool.uv.sources]; it pins the SDKs.
    "lite-model",
]

[project.scripts]
literag = "lite_rag.cli:app"

[project.optional-dependencies]
fastembed = [
    "fastembed==0.9.1",
]
anthropic = [
    "lite-model[anthropic]",
]
pdf = [
    "pypdf==7.0.0",
]
docling = [
    "docling==2.148.0",
]
chonkie = [
    "chonkie==1.7.0",
]
sentence-transformers = [
    "sentence-transformers==6.2.0",
]
chroma = [
    "chromadb==1.5.9",
]
# lite-cache (S18): L1 answers for repeated model calls, off by default (`cache.enabled`).
cache = [
    "lite-cache",
]
server = [
    "fastapi==0.162.2",
    "python-multipart==0.0.33",
    "uvicorn==0.54.0",
]
# `literag eval` runs on lite-eval (design §8), installed from a release wheel in
# [tool.uv.sources] (it carries the Viewer; a git install does not): an upgrade re-runs the eval
# equivalence tests (tests/integration/test_eval_equivalence.py).
eval = [
    "lite-eval",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pypdf==7.0.0",
    "chonkie==1.7.0",
    "fastapi==0.162.2",
    "python-multipart==0.0.33",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "chromadb==1.5.9",
    "lite-rag[eval]",  # the eval tests run lite-eval
    "lite-rag[cache]",  # the cache tests run lite-cache (S18)
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# Full-width punctuation is intentional: Chinese text, prompts and sentence splitting.
allowed-confusables = ["：", "（", "）", "！", "？", "，", "；"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["lite_rag"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jieba", "fastembed", "fastembed.*", "tokenizers", "docling", "docling.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Opt-in, deselected by default: `-m ollama` (the real Ollama server on the host).
addopts = "-m 'not ollama and not model and not voyage'"
# jieba 0.42.1 (unmaintained upstream) has invalid escapes in its own regexes; nothing else.
filterwarnings = ["ignore::SyntaxWarning:jieba.*"]
markers = [
    "ollama: talks to the real Ollama server (opt-in: uv run pytest -m ollama)",
    "model: runs a real local model downloaded from Hugging Face, e.g. the reranker (opt-in: uv run --all-extras pytest -m model)",
    "voyage: the real Voyage AI API, paid per token (opt-in: VOYAGE_API_KEY=... uv run pytest -m voyage)",
]

[tool.uv.sources]
lite-cache = { url = "https://github.com/ArthurGao/lite-cache/releases/download/v0.3.2/lite_cache-0.3.2-py3-none-any.whl" }
lite-model = { url = "https://github.com/ArthurGao/lite-model/releases/download/v0.7.0/lite_model-0.7.0-py3-none-any.whl" }
lite-eval = { url = "https://github.com/ArthurGao/lite-eval/releases/download/v0.4.1/lite_eval-0.4.1-py3-none-any.whl" }
